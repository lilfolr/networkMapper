[workspace]
members = [
    "crates/mapr-schema",
    "crates/mapr-core",
    "crates/mapr-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83.0"
license = "MIT OR Apache-2.0"
authors = ["networkMapper Contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
mapr-schema = { path = "crates/mapr-schema" }
mapr-core = { path = "crates/mapr-core" }

clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "2.0"
anyhow = "1.0"
